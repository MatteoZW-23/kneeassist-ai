# Isolated reproducibility experiment. It does not replace the dashboard models.
project_name: KneeAssist XAI V1 — MRNet reproducibility run
seed: 42
dataset:
  name: MRNet-v1.0
  root: data/MRNet-v1.0
  manifest: data/mrnet_manifest.csv
  # Fixed study-level split copied from the recorded formal experiment.
  splits: runs/mrnet_repro_20261013/splits.json
  patient_mapping: null
targets:
  - key: abnormal
    display: General Abnormality
    threshold: 0.5
  - key: acl
    display: ACL Tear
    threshold: 0.5
  - key: meniscus
    display: Meniscal Tear
    threshold: 0.5
preprocessing:
  image_size: 224
  slices_per_plane: 12
  percentile_low: 1.0
  percentile_high: 99.0
  max_slices: 512
  max_dimension: 1024
  max_upload_mb: 100
  max_dicom_files: 768
  max_dicom_series_slices: 512
  planes: [axial, coronal, sagittal]
model:
  # The two prespecified architectures for the formal comparison objective.
  architectures: [resnet18, efficientnet_b0]
  selected_architecture: auto
  encoder_pretrained: true
  encoder_precision: float32
  training_mode: staged_final_blocks
  pooling: mean_max
  aggregation_method: mean_max
  hidden_dim: 128
  dropout: 0.5
  encoder_chunk_size: 4
training:
  device: auto
  mixed_precision: true
  batch_size: 1
  epochs: 6
  learning_rate: 3.0e-05
  weight_decay: 0.01
  early_stopping_patience: 3
  scheduler_patience: 4
  scheduler_factor: 0.5
  num_workers: 0
  cpu_threads: 4
  modality_dropout: 0.1
  validation_fraction: 0.2
  gradient_clip: 5.0
  warmup_epochs: 40
  gradient_accumulation: 4
  encoder_learning_rate: 1.0e-05
evaluation:
  # The 100-study calibration partition is not used for fitting or model selection.
  threshold_selection: reserved_calibration_youden
  checkpoint: runs/mrnet_repro_20261013/models/best_model.pth
  directory: runs/mrnet_repro_20261013/results
  prediction_examples: 3
  uncertainty_estimation: true
  uncertainty_samples: 10
ui:
  host: 127.0.0.1
  port: 8501
  margin_high: 0.25
  margin_moderate: 0.1
lifecycle:
  state: reproducibility_experiment
  training_enabled: true
  inference_enabled: false
  reset_requested: false
  deletion_completed: false
external_fastmri:
  label_mapping_verified: false
  intended_use: Excluded from this run pending image-label identity verification.
paths:
  # Reuse only fingerprinted frozen pretrained features; no fitted head is shared.
  features: runs/mrnet_fresh_01/features
  models: runs/mrnet_repro_20261013/models
run_directory: runs/mrnet_repro_20261013

project_name: KneeAssist XAI
seed: 42
dataset:
  name: MRNet-v1.0
  root: data/MRNet-v1.0
  manifest: data/mrnet_manifest.csv
  # The active five-model selector uses this single, immutable split for every
  # candidate architecture and for its separate calibration/selector stages.
  splits: data/splits/dynamic_selection_v1.json
  split_manifest: runs/dynamic_selection_v1/protocol.json
  patient_mapping: null
# Routed inference obtains its per-target thresholds from model_registry/active_models.json.
targets:
- key: abnormal
  display: General Abnormality
  threshold: 0.5
- key: acl
  display: ACL Tear
  threshold: 0.5
- key: meniscus
  display: Meniscal Tear
  threshold: 0.5
preprocessing:
  image_size: 224
  slices_per_plane: 12
  percentile_low: 1.0
  percentile_high: 99.0
  max_slices: 512
  max_dimension: 1024
  max_upload_mb: 100
  max_dicom_files: 768
  max_dicom_series_slices: 512
  planes:
  - axial
  - coronal
  - sagittal
model:
  # Live inference is governed by model_registry/active_models.json.
  active_registry: model_registry/active_models.json
  architectures:
  - resnet18
  - resnet50
  - densenet121
  - efficientnet_b0
  - swin_t
  # The fixed five-model benchmark population used by the selection engine.
  # Each member used the saved MRNet split and preprocessing protocol.
  benchmark_architectures:
  - resnet18
  - resnet50
  - densenet121
  - efficientnet_b0
  - swin_t
  selected_architecture: auto
  encoder_pretrained: true
  encoder_precision: float32
  training_mode: staged_final_blocks
  pooling: mean_max
  aggregation_method: mean_max  # Locked to the aggregation method used by all saved research checkpoints.
  hidden_dim: 128
  dropout: 0.5
  encoder_chunk_size: 4
training:
  device: auto
  mixed_precision: true
  batch_size: 1
  epochs: 6
  learning_rate: 3.0e-05
  weight_decay: 0.01
  early_stopping_patience: 3
  scheduler_patience: 4
  scheduler_factor: 0.5
  num_workers: 0
  cpu_threads: 4
  modality_dropout: 0.1
  validation_fraction: 0.2
  gradient_clip: 5.0
  warmup_epochs: 40
  gradient_accumulation: 4
  encoder_learning_rate: 1.0e-05
evaluation:
  # The dashboard loads target routes through the registry. A standalone
  # Predictor must be given an explicit checkpoint path.
  threshold_selection: reserved_calibration_youden
  checkpoint: null
  directory: runs/model_portfolio_v1
  prediction_examples: 3
  uncertainty_estimation: true
  uncertainty_samples: 10
ui:
  host: 127.0.0.1
  port: 8501
  margin_high: 0.25
  margin_moderate: 0.1
lifecycle:
  state: ready_for_research_testing
  training_enabled: false
  inference_enabled: true
  reset_requested: true
  deletion_completed: false
dynamic_selection:
  # All five models execute for each valid analysis. The learned selector chooses
  # one architecture for all three outputs. No training occurs during uploads.
  enabled: true
  artifact: runs/dynamic_selection_v1/selector/dynamic_selector.joblib
  registry: model_registry/dynamic_selection.json
paths:
  models: models
  # Derived feature caches are not required for the saved routed dashboard.
  # A new training experiment should create its own cache under this location.
  features: data/features
run_directory: runs/model_portfolio_v1


